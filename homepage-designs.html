<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homepage designs · Financial AI Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceee7;color:#19281f;font:15px/1.4 "Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}a{color:inherit}button{cursor:pointer}.chooser{max-width:1170px;margin:16px auto;padding:0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.chooser select{border:1px solid #bac8b6;border-radius:8px;padding:8px;background:#fff}.page{--ink:#19281f;--green:#195f42;color:var(--ink);background:#fbf8f1;max-width:1170px;margin:0 auto 32px;border:1px solid #d8dbcf;border-radius:16px;overflow:hidden}.mast,.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:#fffefa}.brand{font-size:21px;font-weight:740;letter-spacing:-.06em;display:flex;align-items:center;gap:8px}.brand svg{width:25px;height:26px}.mast-tools{display:flex;align-items:center;gap:14px;font-size:12px}.mast-tools b{background:#193e2d;color:white;padding:7px 13px;border-radius:6px}.nav{border-block:1px solid #dbe1d3;background:#f3f6ec;gap:19px;justify-content:flex-start;font-size:13px;font-weight:610}.nav span:last-child{margin-left:auto;font-weight:450}.inside{padding:26px 5% 36px}.hero{display:grid;grid-template-columns:1fr .9fr;align-items:center;gap:6%;padding:24px 4%;background:#e5edda;border-radius:16px}.hero h1{font-size:clamp(35px,5vw,66px);line-height:.98;letter-spacing:-.07em;margin:0}.hero p{max-width:36ch;color:#405544;margin:12px 0 0}.calc{background:#fffefa;border:1px solid #ccd8c8;padding:15px 20px;border-radius:13px;display:grid;gap:7px}.calc header,.calc label,.calc footer{display:flex;align-items:center;justify-content:space-between;gap:8px}.seg{display:flex;background:#eaece4;border-radius:18px;padding:2px}.seg button{border:0;color:#2e4536;background:none;border-radius:14px;padding:4px 10px;font-size:12px;font-weight:650}.seg button[aria-pressed=true]{background:#245e40;color:white}.calc label,.calc small{font-size:12px}.calc input{width:100%;height:15px;accent-color:#397952}.calc footer{padding-top:7px;border-top:1px solid #dcded3}.calc output{font-size:24px;font-weight:680;letter-spacing:-.04em}.explore h2{font-size:clamp(25px,3vw,38px);letter-spacing:-.055em;margin:22px 0 14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{--t:#dfe9ce;--s:#355f42;display:flex;flex-direction:column;background:#fffefa;border:1px solid #d5dbce;border-radius:14px;overflow:hidden;text-decoration:none}.card:nth-child(2){--t:#f4e2b7;--s:#84632e}.card:nth-child(3){--t:#d8e9e3;--s:#336756}.art{display:grid;place-items:center;background:var(--t);color:var(--s);height:79px}.art svg{width:80px;height:64px}.copy{padding:14px 17px}.copy h3{font-size:21px;letter-spacing:-.045em;line-height:1.15;margin:0}.copy p{font-size:14px;line-height:1.45;margin:7px 0;color:#4a554a}.card:hover,.card:focus-visible{outline:2px solid var(--s);outline-offset:-2px}
.v2 .hero{background:#204735;color:#fffbed}.v2 .hero p{color:#dcebd5}.v2 .calc{color:#193527}.v2 .cards{grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr}.v2 .card{flex-direction:row;align-items:center}.v2 .card:first-child{grid-row:span 2;flex-direction:column;background:#e1ecd4;justify-content:center;align-items:flex-start}.v2 .card:first-child .art{width:100%;height:74px}.v2 .card:not(:first-child) .art{width:84px;height:100%;flex:none}.v2 .copy{padding:12px 15px}
.v3 .inside{display:grid;grid-template-columns:.95fr 1.05fr;gap:4%;padding-top:32px}.v3 .hero{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;background:#dae6d4;padding:28px;gap:22px}.v3 .hero h1{font-size:clamp(35px,4.6vw,59px)}.v3 .explore h2{margin:0 0 16px}.v3 .cards{grid-template-columns:1fr;gap:10px}.v3 .card{flex-direction:row;align-items:center}.v3 .art{height:100%;width:78px;flex:none;background:#f0f3e9}.v3 .copy h3{font-size:19px}
.v4 .hero{background:#f6e7cd;border-radius:0;border-block:2px solid #564b31}.v4 .hero h1,.v4 .explore h2,.v4 .copy h3{font-family:Georgia,serif;font-weight:500;letter-spacing:-.045em}.v4 .calc{border-radius:4px}.v4 .cards{gap:0;border-block:1px solid #adae9e}.v4 .card{background:transparent;border:0;border-radius:0;padding:13px 16px}.v4 .card+.card{border-left:1px solid #c7c6b7}.v4 .art{background:transparent;place-items:start}.v4 .art svg{width:72px}.v4 .copy{padding:0}.v4 .copy h3{font-size:26px}
.v5 .inside{display:flex;flex-direction:column}.v5 .explore{order:-1}.v5 .explore h2{margin-top:0}.v5 .card{background:var(--t);border:0}.v5 .art{height:85px;justify-items:start;padding-left:17px}.v5 .hero{margin-top:22px;background:#fffefa;border:1px solid #d6dacc}.v5 .hero h1{font-size:clamp(32px,4vw,48px)}.v5 .calc{background:#f0f4e8}
@media(max-width:680px){.page{border-radius:0}.mast,.nav{padding:10px 14px}.nav{gap:7px 13px;flex-wrap:wrap;font-size:12px}.nav span:last-child,.mast-tools>span:first-child{display:none}.inside{padding:16px 12px}.hero,.v3 .inside{grid-template-columns:1fr;gap:14px}.hero{padding:20px}.cards,.v2 .cards{grid-template-columns:1fr}.card,.v2 .card:first-child{flex-direction:row;align-items:center}.art,.v2 .card:first-child .art,.v5 .art{width:76px;flex:none;height:auto;align-self:stretch;padding:0;place-items:center}.art svg{width:63px}.v2 .card:first-child{grid-row:auto}.v3 .hero{padding:20px}.v4 .card+.card{border-left:0;border-top:1px solid #c7c6b7}.v4 .card{gap:12px}.v4 .art{height:60px}.copy{padding:12px}.chooser{padding:0 12px}.brand{font-size:17px}}
</style>
<body><label class="chooser">Homepage design <select id="picker"></select></label><main id="display"></main>
<script>
const styles=['Garden cards','Retirement spotlight','Planning dashboard','Finance journal','Planners first'];
const cards=[['Custom Retirement Plan','Set a retirement income goal and explore when you could reach it.','freedom','<path d="M8 53 33 21l21 32z" fill="#a4c19b"/><path d="m39 54 18-22 18 22z" fill="#739b7a"/><path d="m27 29 6-8 7 10-7-3z" fill="#fff5df"/><path d="M33 21V6l16 4-16 6" fill="#e5bb65"/>'],['Bucket Strategy','Split retirement savings into spending, reserves and long-term growth.','bucket-plan','<g fill="#fff1cb"><path d="m6 33 3 21h15l4-21zM28 26l4 28h16l4-28zM52 20l4 34h16l4-34z"/></g><path d="M7 32q10-16 19 0m3-7q11-18 22 0m2-6q11-20 22 0"/><path d="M13 43h7m16-5h8m16-6h8"/>'],['Salary Plan','See what is left after bills and give your next payday a plan.','salary-budget','<path d="m15 28 1-12 42-6 3 18" fill="#b7ce9d"/><circle cx="38" cy="21" r="5"/><rect x="10" y="25" width="58" height="30" rx="6" fill="#e5c184"/><rect x="52" y="34" width="19" height="12" rx="4" fill="#fcf0c9"/><circle cx="58" cy="40" r="1.5"/>']];
const picker=document.querySelector('#picker');styles.forEach((s,i)=>picker.add(new Option((i+1)+' · '+s,String(i+1))));
const leaf='<svg viewBox="0 0 34 32" aria-hidden="true"><path fill="#24734d" d="M2 27C4 17 12 18 18 18c5 0 8-2 12-5-3 9-8 14-16 14H2Z"/><path fill="#80a449" d="M9 15C13 9 23 8 32 2c1 8-4 13-13 14-4 0-7-1-10-1Z"/></svg>';
function render(n){
 picker.value=String(n); document.querySelector('#display').innerHTML='<div class="page v'+n+'"><div class="mast"><div class="brand">'+leaf+'Financial AI Planner</div><div class="mast-tools"><span>Search</span><span>₹ INR</span><b>Log in</b></div></div><div class="nav"><span>Invest</span><span>Learn Finance</span><span>Calculators</span><span>Blog</span><span>Global Markets</span><span>Convert currency ↗</span></div><div class="inside"><section class="hero"><div><h1>Invest monthly.<br>See it grow.</h1><p>Explore monthly investments and withdrawals over time.</p></div><div class="calc"><header><strong>SIP / SWP calculator</strong><div class="seg"><button aria-pressed="true">SIP</button><button aria-pressed="false">SWP</button></div></header><label for="amt"><span>Monthly investment</span><b></b></label><input id="amt" type="range" min="0" max="10000" step="100" value="1000"><small class="assumptions"></small><footer><small>Estimated balance</small><output></output></footer></div></section><section class="explore"><h2>Explore money</h2><div class="cards">'+cards.map(([title,copy,route,art])=>'<a class="card" href="./'+route+'/"><div class="art"><svg viewBox="0 0 82 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">'+art+'</svg></div><div class="copy"><h3>'+title+'</h3><p>'+copy+'</p></div></a>').join('')+'</div></section></div></div>';
 const fmt=x=>'₹'+Math.round(x).toLocaleString('en-IN');let sip=true;const slider=document.querySelector('#amt');function update(){const a=+slider.value;let balance=sip?0:100000;for(let m=0;m<120;m++)balance=Math.max(0,balance*(1+.08/12)+(sip?a:-a));document.querySelector('.calc label span').textContent=sip?'Monthly investment':'Monthly withdrawal';document.querySelector('.calc label b').textContent=fmt(a);document.querySelector('.assumptions').textContent=(sip?'':'Starting balance ₹1,00,000 · ')+'10 years · 8% illustrative annual return';document.querySelector('.calc output').value=fmt(balance)} slider.oninput=update;document.querySelectorAll('.seg button').forEach(btn=>btn.onclick=()=>{sip=btn.textContent==='SIP';document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));update()});update();
}
function select(){const n=Number(location.hash.slice(1));render(n>=1&&n<=5?n:1)}picker.onchange=()=>location.hash=picker.value;onhashchange=select;select();
</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All planners · four navigation options</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaece5;color:#18251b;font:14px "Segoe UI",Arial,sans-serif}main{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:24px;max-width:1000px;margin:auto}article{min-width:0}h2{font-size:16px;margin:0 0 10px}h2 small{font:650 12px Consolas,monospace;color:#507059;margin-right:9px}.page{background:#faf7f1;border:1px solid #ccd2c6;border-radius:12px;overflow:hidden}.bar{display:flex;gap:16px;align-items:center;background:#f7f8f0;border-bottom:1px solid #dadfd0;padding:10px 16px;color:#455749;font-size:11px;font-weight:600}.bar b{color:#116b42}.body{padding:15px 18px 20px;min-height:128px}h3{font-size:28px;letter-spacing:-1px;line-height:1.1;margin:15px 0 0}.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#165d39;font-size:13px;font-weight:650}.crumb{display:flex;gap:10px;align-items:center;font-size:12px;color:#596259}.crumb span{color:#879485}.pill{padding:7px 12px;border:1px solid #c2d6bd;background:#edf4e7;border-radius:20px}.side{display:flex;align-items:center;gap:12px;margin:17px 0}.side h3{margin:0}.icon{display:grid;place-items:center;border:1px solid #b4c4b1;width:34px;height:34px;border-radius:50%;color:#1e5836}.side small{display:block;color:#4d684e;font-size:11px;font-weight:600;margin-bottom:4px}.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:650px){main{grid-template-columns:1fr;padding:12px}}
</style><main></main><script>
const arrow='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>';
const grid='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h5v5H3zm9 0h5v5h-5zM3 12h5v5H3zm9 0h5v5h-5z"/></svg>';
const title='<h3>Learn Finance</h3>';const entries=[

['02','Simple back link','<a class="back" href="./">'+arrow+'All planners</a>'+title],
['03','Directory pill','<a class="back pill" href="./">'+grid+'All planners</a>'+title],

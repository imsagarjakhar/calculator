name: Test and deploy planners

on:
  push:
    branches: [main, react]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests and production build
    # Keep pull-request code off the persistent deployment machine.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      VITE_VLOG_API_ORIGIN: ${{ vars.VLOG_API_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          # The persistent Windows runner already retains npm's local cache.
          # Archiving/restoring that machine-wide cache was taking 5-9 minutes.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
          package-manager-cache: false
      - name: Prepare Windows Pages tools
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\prepare-windows-pages.ps1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium --no-shell
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium --no-shell
      - run: npm run test:e2e
      - name: Verify private blog reader is deployed
        if: env.VITE_VLOG_API_ORIGIN != '' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.PAGES_DEPLOY_BRANCH || 'main')
        run: node scripts/check-blog-api.cjs
      - name: Upload production site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.PAGES_DEPLOY_BRANCH || 'main')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy selected branch to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.PAGES_DEPLOY_BRANCH || 'main')
    needs: check
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

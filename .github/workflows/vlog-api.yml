name: Deploy vlog publishing API

on:
  push:
    branches: [main, react]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlog-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VLOG_API_ENABLED == 'true' && github.ref == format('refs/heads/{0}', vars.PAGES_DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vlog-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:vlogs
      - name: Deploy Worker and bind private secrets
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GH_VLOG_TOKEN
            ADMIN_PASSWORD
            SESSION_SECRET
        env:
          GH_VLOG_TOKEN: ${{ secrets.GH_VLOG_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.VLOG_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.VLOG_SESSION_SECRET }}

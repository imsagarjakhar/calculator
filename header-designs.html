<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five header designs · Financial AI Planner</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#172c24;font:14px "Segoe UI",Arial,sans-serif}main{width:min(100%,852px);margin:auto;padding:16px 24px 28px}article{margin:0 0 20px}h2{font-size:15px;letter-spacing:-.02em;margin:8px 0 9px}h2 i{font:600 11px Consolas,monospace;color:#53685a;margin-right:10px}.frame{background:#fffdfa;border:1px solid #d5d8cf;border-radius:12px;overflow:hidden;box-shadow:0 3px 8px #19322408}.row,nav,.tools,.brand{display:flex;align-items:center}.row{justify-content:space-between;padding:14px 19px;gap:10px}.brand{gap:8px;white-space:nowrap;font-size:19px;font-weight:730;letter-spacing:-.85px}.logo{width:25px;height:27px;fill:currentColor;color:#21814d}.tools{gap:12px;font-size:12px}.login,.currency,.search{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.login{padding:8px 13px;background:#183d2e;color:white;font-weight:650;border-radius:7px}.glass{width:13px;height:13px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8}.currency{border-left:1px solid #bdc9be;padding-left:11px}.nav{gap:23px;font-weight:610;font-size:13px;white-space:nowrap}.nav span{display:inline-flex;align-items:center;gap:7px}.bottom{border-top:1px solid #dcdfd4;background:#f7f8f0;padding-block:10px}.one .bottom .nav{gap:24px}.one .search{background:#f3f4ed;padding:7px 11px;border-radius:20px;color:#47594c}.convert{font-size:12px;color:#3d6552}.two{background:#142f26;color:#f7f8ed}.two .row{padding:17px 16px}.two .brand{font-size:15px;gap:4px}.two .logo{width:20px;color:#b7e494}.two .nav{font-size:12px;gap:13px}.two .tools{gap:9px}.two .login{background:#d2eeaa;color:#173728}.two .currency{border-color:#537465}.three .row:first-child{justify-content:center;position:relative;padding:15px}.three .brand{font:700 25px Georgia,serif;letter-spacing:-1.25px}.three .search{position:absolute;left:19px;font-size:12px}.three .tools{position:absolute;right:18px}.three .login{background:transparent;color:#18382a;border:1px solid #a8b5a7;border-radius:30px}.three nav{justify-content:center;border-top:1px solid #dcdfd4;border-bottom:3px double #456b53;padding:10px;gap:37px}.four{background:#e6eddf;padding:10px;border:0}.four .row{background:white;border-radius:30px;padding:7px 13px;box-shadow:0 2px 7px #314e3512}.four .brand{font-size:17px}.four .login{border-radius:30px}.four nav{justify-content:space-around;margin:9px auto 0;padding:3px 5px;color:#294c37}.four .tools{gap:15px}.five .top{background:#eff2ec;padding-block:6px;color:#3e574a}.five .top .tools{margin-left:auto}.five .main{padding-block:15px}.five .brand{font-size:17px;gap:5px}.five .nav{gap:16px;font-size:12px}.five .login{border-radius:3px;background:#141f19}.utility{font-size:12px}.nav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
@media(max-width:730px){main{padding:12px}.row,.two .row,.five .main{flex-wrap:wrap}.two nav,.five nav{order:2;width:100%;justify-content:space-around}.three .row:first-child{justify-content:space-between}.three .search{display:none}.three .tools{position:static}.nav,.three nav,.one .bottom .nav{flex-wrap:wrap;gap:10px 16px}.one .bottom{flex-wrap:wrap}.four nav{gap:10px}}
</style><body><main></main><script>
const logo='<svg class="logo" viewBox="0 0 34 32" aria-hidden="true"><path d="M2 27C4 17 12 18 18 18c5 0 8-2 12-5-3 9-8 14-16 14H2Z"/><path opacity=".7" d="M9 15C13 9 23 8 32 2c1 8-4 13-13 14-4 0-7-1-10-1Z"/></svg>';
const glass='<svg class="glass" viewBox="0 0 20 20"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg>';
const brand='<div class="brand">'+logo+'Financial AI Planner</div>', search='<span class="search">'+glass+' Search</span>', curr='<span class="currency">₹ INR ⌄</span>',login='<span class="login">Log in</span>',convert='<span class="convert">Convert currency ↗</span>';
const names=['Invest','Learn Finance','Calculators','Blog','Global Markets'];
const icons=['M2 16l5-5 3 2 6-8 M12 5h4v4','M2 4q4-2 7 1 4-3 7-1v10q-4-1-7 1-3-2-7-1z M9 5v10','M4 2h10v14H4z M6 6h6 M6 9h1m3 0h1m-5 3h1m3 0h1','M3 3h12v12H3z M6 6h6 M6 9h6 M6 12h3','M16 9a7 7 0 1 1-14 0 7 7 0 0 1 14 0 M2 9h14 M9 2q-6 7 0 14 6-7 0-14'];
const nav=(ic=false)=>'<nav class="nav">'+names.map((n,i)=>'<span>'+(ic?'<svg viewBox="0 0 18 18"><path d="'+icons[i]+'"/></svg>':'')+n+'</span>').join('')+'</nav>';
const tools=(...xs)=>'<div class="tools">'+xs.join('')+'</div>',row=(a,c='')=>'<div class="row '+c+'">'+a+'</div>';
const designs=[
['01','Classic two-row','one',row(brand+tools(search,curr,login))+row(nav()+convert,'bottom')],
['02','Compact forest','two',row(brand+nav()+tools(glass,curr,login))],
['03','Editorial masthead','three',row(search+brand+tools(curr,login))+nav()],
['04','Floating toolbar','four',row(brand+tools(search,curr,login))+nav(true)],
['05','Utility strip','five',row(tools(search,curr,convert),'top')+row(brand+nav()+login,'main')]
];document.querySelector('main').innerHTML=designs.map(([n,t,c,h])=>'<article><h2><i>'+n+'</i>'+t+'</h2><div class="frame '+c+'">'+h+'</div></article>').join('');
</script></body></html>
